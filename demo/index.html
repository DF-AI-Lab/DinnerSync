<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DinnerSync demo</title>
  <meta name="description" content="Everything finishes together.">
  <meta name="theme-color" content="#121012">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/simple.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <div class="brand-group">
        <img class="logo" src="assets/logo.png" alt="">
        <div class="brand-text">
          <div class="brand-line">
            <h1 class="brand">DinnerSync</h1>
            <span id="app-version" class="app-version">v2.0.0</span>
          </div>
          <p class="tagline">everything finishes together</p>
        </div>
      </div>
      <div class="top-side">
        <button id="reset" class="pill" type="button">Reset</button>
        <span id="now-clock" class="now-clock" aria-label="Time now"></span>
      </div>
    </header>

    <!-- Plan: the dishes, when dinner is, Start cooking -->
    <section id="plan" class="screen">
      <div class="card">
        <div class="card-head">
          <h2 class="label">What are you cooking?</h2>
          <button class="pill soon" type="button" disabled>Saved meals (soon)</button>
        </div>
        <ul id="dishes" class="dishes"></ul>
        <form id="add-form" class="add-row">
          <label class="sr" for="add-name">Dish name</label>
          <input id="add-name" placeholder="Add a dish, e.g. Gravy" autocomplete="off" enterkeyhint="done">
          <button class="btn" type="submit">Add</button>
        </form>
      </div>

      <div class="card">
        <div class="seg" role="group" aria-label="When">
          <button id="mode-now" type="button" class="on">Start now</button>
          <button id="mode-at" type="button">Ready at…</button>
        </div>
        <div class="dinner-row">
          <span class="label">Dinner at</span>
          <div class="dinner-at">
            <button id="later-minus" class="step" type="button" aria-label="15 min earlier" hidden>−</button>
            <b id="dinner-at">--</b>
            <button id="later-plus" class="step" type="button" aria-label="15 min later" hidden>+</button>
          </div>
        </div>
        <p id="takes" class="muted"></p>
      </div>

      <button id="start" class="btn go big-go" type="button">Start cooking</button>
    </section>

    <!-- Cooking: the ring, the next alarm, each dish -->
    <section id="cook" class="screen" hidden>
      <div class="ringbox">
        <svg viewBox="0 0 120 120" aria-hidden="true">
          <circle class="track" cx="60" cy="60" r="52"/>
          <circle id="ring-prog" class="prog" cx="60" cy="60" r="52" stroke-dasharray="326.7" stroke-dashoffset="0"/>
        </svg>
        <div class="ring-in">
          <small id="ring-label" class="label">Dinner in</small>
          <span id="ring-time" class="big">0:00</span>
          <small id="ring-sub" class="muted"></small>
        </div>
      </div>

      <div id="next" class="card next">
        <div class="next-head">
          <span id="next-badge" class="badge">NEXT ALARM</span>
          <span id="next-at" class="muted"></span>
        </div>
        <b id="next-text" class="next-text"></b>
        <div class="next-row">
          <span id="next-count" class="count"></span>
          <button id="done" class="btn ok" type="button" hidden>Done ✓</button>
        </div>
      </div>

      <ul id="cook-list" class="cook-list"></ul>
    </section>

    <audio id="keep-alive" loop preload="auto" hidden></audio>
  </main>
  <script type="module" src="js/simple-app.js"></script>
</body>
</html>
