<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>DinnerSync</title>
  <meta name="description" content="Everything finishes together.">
  <meta name="theme-color" content="#121012">
  <meta name="color-scheme" content="dark">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icons/icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="icons/icon-192.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400..800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main class="app">
    <header class="top">
      <h1 class="brand">DinnerSync</h1>
      <p class="tag">everything finishes together</p>
    </header>

    <!-- Screen 1: plan the evening -->
    <section id="plan-screen" class="screen">
      <div class="card">
        <h2>When's dinner?</h2>
        <div class="ready-row">
          <label class="field">
            <span>Ready in (min)</span>
            <input id="ready-in" type="number" inputmode="numeric" min="1" step="5" value="90">
          </label>
          <label class="field">
            <span>Or at</span>
            <input id="ready-at" type="time">
          </label>
        </div>
        <p id="ready-clock" class="ready-clock"></p>
      </div>

      <div class="card">
        <h2>Add an item</h2>
        <label class="field wide">
          <span>Name</span>
          <input id="item-name" type="text" autocomplete="off" placeholder="Chicken">
        </label>
        <div id="stage-rows" class="stage-list">
          <div class="stage-row" data-method="oven">
            <div class="stage-head">
              <span class="label stage-num">Stage 1</span>
              <button class="icon-btn stage-remove" type="button" aria-label="Remove stage" hidden>✕</button>
            </div>
            <div class="seg" role="group" aria-label="Method">
              <button class="seg-btn" type="button" data-method="oven" aria-pressed="true">♨️ Oven</button>
              <button class="seg-btn" type="button" data-method="hob" aria-pressed="false">🔥 Hob</button>
              <button class="seg-btn" type="button" data-method="rest" aria-pressed="false">⏸ Rest</button>
            </div>
            <div class="stage-fields">
              <label class="field">
                <span>Minutes</span>
                <input id="item-minutes" class="stage-minutes" type="number" inputmode="numeric" min="1">
              </label>
              <label class="field stage-temp">
                <span>Temp (°C)</span>
                <input id="item-temp" class="stage-temp-input" type="number" inputmode="numeric" min="50" max="300">
              </label>
            </div>
          </div>
        </div>
        <button id="add-stage" class="btn ghost block" type="button">+ Then</button>
        <p id="item-error" class="error" hidden></p>
        <button id="add-item" class="btn primary block" type="button">Add to tonight</button>
      </div>

      <template id="stage-template">
        <div class="stage-row" data-method="oven">
          <div class="stage-head">
            <span class="label stage-num"></span>
            <button class="icon-btn stage-remove" type="button" aria-label="Remove stage">✕</button>
          </div>
          <div class="seg" role="group" aria-label="Method">
            <button class="seg-btn" type="button" data-method="oven" aria-pressed="true">♨️ Oven</button>
            <button class="seg-btn" type="button" data-method="hob" aria-pressed="false">🔥 Hob</button>
            <button class="seg-btn" type="button" data-method="rest" aria-pressed="false">⏸ Rest</button>
          </div>
          <div class="stage-fields">
            <label class="field">
              <span>Minutes</span>
              <input class="stage-minutes" type="number" inputmode="numeric" min="1">
            </label>
            <label class="field stage-temp">
              <span>Temp (°C)</span>
              <input class="stage-temp-input" type="number" inputmode="numeric" min="50" max="300">
            </label>
          </div>
        </div>
      </template>

      <div class="card">
        <h2>Tonight</h2>
        <p id="items-empty" class="muted">Nothing yet. Add an item or tap a saved one.</p>
        <ul id="items" class="items"></ul>
      </div>

      <div class="card">
        <h2>Saved items</h2>
        <div id="saved-items" class="chips"></div>
      </div>

      <div class="card">
        <label class="field">
          <span>Preheat (min)</span>
          <input id="preheat" type="number" inputmode="numeric" min="0" step="5">
        </label>
      </div>

      <div id="status" class="status" hidden></div>
      <p id="plan-error" class="error" hidden></p>
      <button id="show-plan" class="btn primary big block" type="button">Show plan</button>
    </section>

    <!-- Screen 2: timeline -->
    <section id="timeline-screen" class="screen" hidden>
      <div class="row">
        <button id="back-plan" class="btn ghost" type="button">← Back</button>
      </div>
      <h2 class="page-title">Plan</h2>
      <p id="timeline-ready" class="muted"></p>
      <p id="timeline-oven" class="muted"></p>
      <div id="timeline-note" class="status warn" hidden></div>
      <ol id="plan-steps" class="steps"></ol>
      <button id="start-cooking" class="btn primary big block" type="button">Start cooking</button>
    </section>

    <!-- Screen 3: cooking -->
    <section id="cook-screen" class="screen cook" hidden>
      <p id="cook-now" class="now"></p>

      <div class="next">
        <p id="next-label" class="label">Next</p>
        <p id="next-time" class="num huge">--:--</p>
      </div>

      <div id="preheat-block" class="card block-center" hidden>
        <span class="label">Preheating, ready in</span>
        <span id="preheat-left" class="num med">--:--</span>
      </div>

      <div class="dinner">
        <span class="label">Dinner in</span>
        <span id="dinner-in" class="num med">--:--</span>
      </div>

      <p id="oven-temp" class="oven"></p>

      <button id="stop-cooking" class="btn ghost big block" type="button">Stop cooking</button>
    </section>
  </main>

  <div id="alarm-banner" class="alarm" role="alertdialog" aria-live="assertive" hidden>
    <p id="alarm-text"></p>
    <button id="alarm-done" class="btn big block done" type="button">Done ✓</button>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
